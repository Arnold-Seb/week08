# FAULT INJECTION BUILD. Used only to demonstrate automatic rollback.
#
# This is deliberately an intermittent fault rather than a total outage.
# One in five requests to the site returns 503; /healthz always returns 200.
#
# That combination is the realistic case and the reason the pipeline needs a
# bake window. Kubernetes sees a ready pod, so the rollout succeeds. A single
# smoke request almost always succeeds, so the pre-switch gate passes. Only a
# sustained probe across hundreds of requests shows the failure rate, which is
# exactly the class of bug that reaches production in real systems.

split_clients "${remote_addr}${request_id}" $fault_bucket {
    20%     "fail";
    *       "ok";
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    location /api/users/ {
        proxy_pass http://user-service:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/students/ {
        proxy_pass http://student-service:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/lecturers/ {
        proxy_pass http://lecturer-service:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/courses/ {
        proxy_pass http://course-service:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/enrollments/ {
        proxy_pass http://enrollment-service:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Readiness endpoint. Deliberately separate from the paths users hit,
    # so the probe can pass while user traffic is failing. That gap is the
    # reason a bake window exists.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        if ($fault_bucket = "fail") {
            return 503 'service unavailable';
        }
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}