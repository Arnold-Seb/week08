name: 05 - Monitoring

# Monitoring is installed once per cluster, not once per release, so it sits
# with the infrastructure rather than in the application deploy. helm upgrade
# --install is idempotent, so running this again is safe.
on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "00 - Infrastructure"
    types:
      - completed
    branches:
      - main

jobs:
  monitoring:
    name: Deploy and validate monitoring
    runs-on: ubuntu-latest

    if: >
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add the Prometheus chart repository
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Install or upgrade kube-prometheus-stack
        run: |
          helm upgrade --install prometheus \
            prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --wait \
            --timeout 10m

      - name: Validate the monitoring pods are running
        run: |
          kubectl get pods -n monitoring
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=grafana \
            -n monitoring \
            --timeout=300s

      - name: Confirm Prometheus is collecting metrics
        run: |
          kubectl get servicemonitors -n monitoring
          kubectl get svc -n monitoring
